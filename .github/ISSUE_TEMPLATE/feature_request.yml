name: Feature request
description: An idea for a new tool or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Issues here are public, so leave out anything private.
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: What it would help you do, and how you do it today.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in by Printwright, if you chose to include it.
      render: text
